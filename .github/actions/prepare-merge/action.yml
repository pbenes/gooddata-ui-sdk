name: Create pull-request between branches with resolution
description: prepare a pull-request from one branch to another with custom resolution strategy
inputs:
  source-branch:
    required: true
    description: source branch
  target-branch:
    required: true
    description: target branch

outputs:
  pr-url:
    description: url of the created pull-request
    value: ${{ steps.prepare-pr.outputs.pr-url }}

runs:
  using: "composite"
  steps:
      #    - name: Clean pr temporary branch if already exists
      #      uses: ./.github/actions/delete-branch
      #      with:
      #        branch: ${{ inputs.source-branch }}-to-${{ inputs.target-branch }}

    - name: Add repository to git safe directories to avoid dubious ownership issue
      run: git config --global --add safe.directory $GITHUB_WORKSPACE
      shell: bash

    - name: Config user
      run: |
         git config --global user.email "git-action@gooddata.com"
         git config --global user.name "git-action"
      shell: bash

    - name: Prepare pr with attempt to resolve conflicts
      id: prepare-pr
      run: |
          # attempt to merge, check conflicts, if only in certain files, use $TARGET_BRANCH to resolve
          git fetch origin
          git checkout $SOURCE_BRANCH

          # do not use cutoff action, it breaks the history
          TMP_BRANCH=$SOURCE_BRANCH-to-$TARGET_BRANCH
          git branch -D $TMP_BRANCH || true
          git push origin --delete "$TEMP_BRANCH" || true

          git checkout -b $TMP_BRANCH
          # rush bump to something that's in master
          git merge --verbose origin/$TARGET_BRANCH || true

          # we are resolving only conflicts which we can do, we silently ignore other potential conflits
          conflicting_files=$(git diff --name-only --diff-filter=U | grep -E 'package.json|version-policies.json')

          # perform back-merge resolution
          for file in $conflicting_files
          do
              git checkout --theirs $file
              git add $file
          done

          has_conflicts=false
          conflicting_files=$(git diff --name-only --diff-filter=U)
          if [ -n "$conflicting_files" ]; then
            echo "There are conflicts which still need to be resolved, aborting"
            has_conflicts=true
            git merge --abort
          else
            git commit --no-verify -m "Resolved merge conflicts to match $TARGET_BRANCH"
            git push origin $TMP_BRANCH
          fi

          PR_OUTPUT=$(gh pr create --title "Merge $SOURCE_BRANCH into $TARGET_BRANCH" --body "" --base $TARGET_BRANCH --head "$TMP_BRANCH")
          PR_URL=$(echo "$PR_OUTPUT" | grep -o 'https://github.com[^ ]*')
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "pr_has_conflicts=$has_conflicts" >> $GITHUB_OUTPUT
      env:
          SOURCE_BRANCH: ${{ inputs.source-branch }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
      shell: bash
